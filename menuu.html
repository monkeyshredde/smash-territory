<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Game Menu</title>
    <style>
        /* Reset and Basic Styles */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        /* Background Grid Animation */
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            z-index: -1;
        }

        .grid div {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fade 5s infinite;
        }

        .grid div:nth-child(odd) {
            animation-delay: 2.5s;
        }

        @keyframes fade {
            0%, 100% {
                background: rgba(255, 255, 255, 0.05);
            }
            50% {
                background: rgba(255, 255, 255, 0.15);
            }
        }

        /* Center Content */
        .menu-container {
            text-align: center;
            z-index: 10;
            animation: slideDown 1.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Title Styles */
        h1 {
            font-size: 2.5rem; /* Slightly smaller for better mobile compatibility */
            margin-bottom: 20px;
            background: linear-gradient(90deg, #4e54c8, #8f94fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: subtleGlow 2s infinite alternate;
        }

        @keyframes subtleGlow {
            from {
                text-shadow: 0 0 5px #4e54c8, 0 0 10px #8f94fb, 0 0 15px #4e54c8;
            }
            to {
                text-shadow: 0 0 3px #4e54c8, 0 0 6px #8f94fb, 0 0 9px #4e54c8;
            }
        }

        /* Button Styles */
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            box-shadow: 0 6px 10px rgba(255, 75, 43, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Description Text */
        p {
            font-size: 1rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Animated Background Grid -->
    <div class="grid">
        <!-- 400 Divs for Grid Animation -->
        <script>
            for (let i = 0; i < 400; i++) {
                document.write('<div></div>');
            }
        </script>
    </div>

    <!-- Menu Content -->
    <div class="menu-container">
        <h1>Welcome to Smash Territory</h1>
        <p>Claim your territory and become the champion!</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <script>
        function startGame() {
            // Redirect to the game
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
